<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyVet Drug Shop — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🐾</div>
      <div><div class="brand-name">JoyVet</div><div class="brand-sub">Drug Shop</div></div>
    </div>
    <nav class="nav-list">
      <a class="nav-link" href="index.html"><span class="nav-icon">📊</span>Dashboard</a>
      <a class="nav-link" href="pos.html"><span class="nav-icon">🧾</span>POS</a>
      <a class="nav-link" href="orders.html"><span class="nav-icon">🔔</span>Orders <span class="nav-badge" id="navBadge"></span></a>
      <a class="nav-link" href="sales-history.html"><span class="nav-icon">🕘</span>Sales History</a>
      <a class="nav-link" href="products.html"><span class="nav-icon">💊</span>Products</a>
      <a class="nav-link" href="customer-portal.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-link" href="suppliers.html"><span class="nav-icon">🚚</span>Suppliers</a>
      <a class="nav-link" href="attendence.html"><span class="nav-icon">🕒</span>Staff / Attendance</a>
      <a class="nav-link" href="stock-expiry.html"><span class="nav-icon">⏳</span>Stock / Expiry</a>
      <a class="nav-link active" href="report.html"><span class="nav-icon">📈</span>Reports</a>
    </nav>
    <div class="sidebar-footer">
      <div class="owner-chip">
        <div class="owner-avatar">YJ</div>
        <div><div class="owner-name">Yiga Josephat</div><div class="owner-role">Owner</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="topbar-title">Reports</h1>
        <p class="topbar-sub">Sales performance across time and staff</p>
      </div>
      <div class="period-toggle" id="periodToggle">
        <button class="period-btn active" data-period="today" onclick="setPeriod('today')">Today</button>
        <button class="period-btn" data-period="month" onclick="setPeriod('month')">This Month</button>
        <button class="period-btn" data-period="year" onclick="setPeriod('year')">This Year</button>
      </div>
    </header>

    <section class="stat-grid" id="reportStats"></section>

    <section class="content-grid">
      <div class="panel">
        <div class="panel-head"><h2>Top Selling Products</h2></div>
        <div id="topProducts"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Staff Performance</h2></div>
        <table class="data-table">
          <thead><tr><th>Worker</th><th>Sales</th><th>Total</th></tr></thead>
          <tbody id="staffPerformanceBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" style="margin-top:18px;">
      <div class="panel-head"><h2>Payment Method Breakdown</h2></div>
      <div id="paymentBreakdown"></div>
    </section>

  </main>
</div>

<script src="report.js"></script>
</body>
</html>
