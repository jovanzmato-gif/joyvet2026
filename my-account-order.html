<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoyVet Drug Shop — Place an Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14233d;
      --navy-2: #1d3157;
      --orange: #f0a04b;
      --cream: #fff8ef;
      --ink: #1b2a41;
      --muted: #5f6f86;
      --line: #e6ebf2;
      --red: #b91c1c;
      --green: #15803d;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; color: var(--ink); background: #f4f6fa; min-height: 100vh; }
    h1, h2 { font-family: 'Space Grotesk', Inter, sans-serif; margin: 0; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 6vw; background: var(--navy); color: #fff; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .logo-mark { width: 40px; height: 40px; border-radius: 12px; background: #e5533d; display: grid; place-items: center; font-size: 20px; }
    .logo-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
    .top a.back { color: rgba(255,255,255,0.85); font-size: 14px; text-decoration: none; }

    .wrap { max-width: 980px; margin: 0 auto; padding: 26px 6vw 60px; }
    .head h1 { font-size: 28px; }
    .head p { color: var(--muted); margin: 6px 0 22px; }

    .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .panel { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 6px 20px rgba(20,35,61,0.06); }
    .panel h2 { font-size: 18px; margin-bottom: 14px; }

    .filter { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    input, select, textarea {
      font: inherit; width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    }
    textarea { resize: vertical; min-height: 70px; }
    .filter input { flex: 1 1 220px; }

    .product {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .product:last-child { border-bottom: 0; }
    .product strong { display: block; font-size: 15px; }
    .product small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .price { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--navy); font-size: 15px; margin-top: 4px; display: block; }
    .avail { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-left: 6px; }
    .avail-in { background: #dcfce7; color: var(--green); }
    .avail-limited { background: #fef3c7; color: var(--amber); }
    .avail-out { background: #fee2e2; color: var(--red); }

    .qty { width: 84px; text-align: center; }
    .qty:disabled { background: #f0f2f6; }

    .cart-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .cart-line:last-child { border-bottom: 0; }
    .cart-total { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin: 14px 0; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .hidden { display: none !important; }

    .btn { font: inherit; font-weight: 700; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--orange); color: var(--navy); cursor: pointer; }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .msg { font-size: 14px; margin-top: 12px; min-height: 20px; }
    .msg.error { color: var(--red); }
    .msg.success { color: var(--green); }
    .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>

  <header class="top">
    <a class="logo" href="my-account.html">
      <div class="logo-mark">🐾</div>
      <div class="logo-name">JoyVet</div>
    </a>
    <a class="back" href="my-account.html">← Back to my account</a>
  </header>

  <main class="wrap">
    <div id="gate" class="panel hidden">
      <h2>Please sign in</h2>
      <p class="empty">You need to sign in to place an order.</p>
      <a class="btn" href="my-account.html" style="display:block; text-align:center; text-decoration:none;">Go to my account</a>
    </div>

    <div id="main" class="hidden">
      <div class="head">
        <h1>Place an order</h1>
        <p>Choose what you need, then tell us whether you will collect it or want delivery.</p>
      </div>

      <div class="grid">
        <section class="panel">
          <h2>Our products</h2>
          <div class="filter">
            <input id="searchBox" type="search" placeholder="Search medicines, vaccines, feeds…">
          </div>
          <div id="productList"></div>
        </section>

        <aside class="panel">
          <h2>Your order</h2>
          <div id="cartList"><p class="empty">No items yet.</p></div>
          <div class="cart-total" id="cartTotal">UGX 0</div>

          <div class="form-group">
            <label for="method">Collection</label>
            <select id="method">
              <option value="pickup">I will pick it up</option>
              <option value="delivery">Please deliver it</option>
            </select>
          </div>

          <div class="form-group hidden" id="addressGroup">
            <label for="address">Delivery address</label>
            <input id="address" type="text" placeholder="Village, town and landmark">
          </div>

          <div class="form-group">
            <label for="note">Note (optional)</label>
            <textarea id="note" placeholder="e.g. Please keep the vaccine cool"></textarea>
          </div>

          <button id="submitBtn" class="btn" type="button">Place my order</button>
          <div id="orderMsg" class="msg"></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="my-account-order.js"></script>
</body>
</html>
