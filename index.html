<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyVet Drug Shop — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🐾</div>
      <div>
        <div class="brand-name">JoyVet</div>
        <div class="brand-sub">Drug Shop</div>
      </div>
    </div>

    <nav class="nav-list">
      <a class="nav-link active" href="index.html"><span class="nav-icon">📊</span>Dashboard</a>
      <a class="nav-link" href="pos.html"><span class="nav-icon">🧾</span>POS</a>
      <a class="nav-link" href="orders.html"><span class="nav-icon">🔔</span>Orders <span class="nav-badge" id="navBadge"></span></a>
      <a class="nav-link" href="sales-history.html"><span class="nav-icon">🕘</span>Sales History</a>
      <a class="nav-link" href="products.html"><span class="nav-icon">💊</span>Products</a>
      <a class="nav-link" href="customer-portal.html"><span class="nav-icon">👥</span>Customers</a>
      <a class="nav-link" href="suppliers.html"><span class="nav-icon">🚚</span>Suppliers</a>
      <a class="nav-link" href="attendence.html"><span class="nav-icon">🕒</span>Staff / Attendance</a>
      <a class="nav-link" href="stock-expiry.html"><span class="nav-icon">⏳</span>Stock / Expiry</a>
      <a class="nav-link" href="report.html"><span class="nav-icon">📈</span>Reports</a>
    </nav>

    <div class="sidebar-footer">
      <div class="owner-chip">
        <div class="owner-avatar">YJ</div>
        <div>
          <div class="owner-name">Yiga Josephat</div>
          <div class="owner-role">Owner</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="topbar-title">Dashboard</h1>
        <p class="topbar-sub" id="todayDate"></p>
      </div>
      <div class="topbar-actions">
        <a href="products.html" class="btn-ghost" style="text-decoration:none;">+ Add Product</a>
        <a href="pos.html" class="btn-primary" style="text-decoration:none;">+ New Sale</a>
      </div>
    </header>

    <section class="stat-grid" id="statGrid"></section>

    <section class="content-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>Recent Sales</h2>
          <a href="sales-history.html" class="panel-link">View all →</a>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>Product</th><th>Customer</th><th>Qty</th><th>Amount</th><th>Time</th></tr>
          </thead>
          <tbody id="recentSalesBody"></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Stock &amp; Expiry Alerts</h2>
          <a href="stock-expiry.html" class="panel-link">View all →</a>
        </div>
        <div id="alertsList"></div>
      </div>
    </section>

  </main>
</div>

<script src="dashbord.js"></script>
</body>
</html>
