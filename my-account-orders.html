<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoyVet Drug Shop — My Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14233d;
      --orange: #f0a04b;
      --cream: #fff8ef;
      --ink: #1b2a41;
      --muted: #5f6f86;
      --line: #e6ebf2;
      --green: #15803d;
      --amber: #b45309;
      --red: #b91c1c;
      --blue: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; color: var(--ink); background: #f4f6fa; min-height: 100vh; }
    h1, h2 { font-family: 'Space Grotesk', Inter, sans-serif; margin: 0; }

    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 6vw; background: var(--navy); color: #fff; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
    .logo-mark { width: 40px; height: 40px; border-radius: 12px; background: #e5533d; display: grid; place-items: center; font-size: 20px; }
    .logo-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
    .top a.back { color: rgba(255,255,255,0.85); font-size: 14px; text-decoration: none; }

    .wrap { max-width: 820px; margin: 0 auto; padding: 26px 6vw 60px; }
    .head h1 { font-size: 28px; }
    .head p { color: var(--muted); margin: 6px 0 22px; }

    .panel { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 6px 20px rgba(20,35,61,0.06); margin-bottom: 16px; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .order-id { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
    .order-date { font-size: 13px; color: var(--muted); }
    .items { margin: 12px 0; font-size: 14px; color: var(--ink); }
    .meta { font-size: 13px; color: var(--muted); }

    .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
    .s-pending { background: #dbeafe; color: var(--blue); }
    .s-confirmed { background: #fef3c7; color: var(--amber); }
    .s-unavailable { background: #fee2e2; color: var(--red); }
    .s-fulfilled { background: #dcfce7; color: var(--green); }
    .status-text { font-size: 14px; color: var(--ink); margin-top: 10px; }

    .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
    .btn { display: inline-block; font-weight: 700; padding: 12px 18px; border-radius: 12px; background: var(--orange); color: var(--navy); text-decoration: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="top">
    <a class="logo" href="my-account.html">
      <div class="logo-mark">🐾</div>
      <div class="logo-name">JoyVet</div>
    </a>
    <a class="back" href="my-account.html">← Back to my account</a>
  </header>

  <main class="wrap">
    <div id="gate" class="panel hidden">
      <h2>Please sign in</h2>
      <p class="empty">You need to sign in to see your orders.</p>
      <a class="btn" href="my-account.html">Go to my account</a>
    </div>

    <div id="main" class="hidden">
      <div class="head">
        <h1>My orders</h1>
        <p>Here is the status of every order you have placed.</p>
      </div>
      <div id="ordersList"></div>
    </div>
  </main>

  <script src="my-account-orders.js"></script>
</body>
</html>
